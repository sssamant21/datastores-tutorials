apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: elasticsearch-lab-002
data:
  elasticsearch.yml: |
    cluster.name: es-production-installation-lab
    network.host: 0.0.0.0
    discovery.seed_hosts:
      - elasticsearch-0.elasticsearch-headless
      - elasticsearch-1.elasticsearch-headless
      - elasticsearch-2.elasticsearch-headless
    cluster.initial_master_nodes:
      - elasticsearch-0
      - elasticsearch-1
      - elasticsearch-2
    xpack.security.enabled: true
    xpack.security.http.ssl.enabled: true
    xpack.security.http.ssl.key: certs/http/tls.key
    xpack.security.http.ssl.certificate: certs/http/tls.crt
    xpack.security.http.ssl.certificate_authorities: ["certs/ca/ca.crt"]
    xpack.security.transport.ssl.enabled: true
    xpack.security.transport.ssl.verification_mode: full
    xpack.security.transport.ssl.key: certs/transport/tls.key
    xpack.security.transport.ssl.certificate: certs/transport/tls.crt
    xpack.security.transport.ssl.certificate_authorities: ["certs/ca/ca.crt"]
