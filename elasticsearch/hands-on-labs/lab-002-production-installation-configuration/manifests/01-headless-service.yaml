apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: elasticsearch-lab-002
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: elasticsearch-lab-002
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
